<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompter">
<title>Teleprompter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/version.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<!-- LIBRERIA -->
<section id="view-library" class="view">
  <header class="topbar">
    <h1>Teleprompter</h1>
    <button id="lib-paste" class="btn">Incolla</button>
    <button id="lib-import" class="btn">Importa file</button>
    <button id="lib-new" class="btn primary">+ Nuovo</button>
    <input id="lib-file" type="file" multiple hidden
      accept=".txt,.md,.markdown,.rtf,.html,.htm,.pdf,.json,text/plain,text/markdown,text/html,text/rtf,application/rtf,application/pdf,application/json">
    <input id="lib-restore-file" type="file" hidden accept=".json,application/json">
  </header>
  <div class="searchbar"><input id="lib-search" type="search" placeholder="Cerca negli script" autocomplete="off"></div>
  <ul id="lib-list" class="script-list"></ul>
  <div id="lib-empty" class="empty" hidden>
    <p><strong>Nessuno script.</strong></p>
    <p>Crea uno script nuovo, incolla un testo dagli appunti o importa dei file (.pdf, .txt, .md, .rtf, .html).</p>
    <p>Hai un backup? Usa «Ripristina backup» qui sotto.</p>
  </div>
  <footer class="lib-footer">
    <button id="lib-backup" class="btn small">Esporta backup</button>
    <button id="lib-restore" class="btn small">Ripristina backup</button>
    <span id="lib-backup-info"></span>
    <span id="app-version"></span>
  </footer>
</section>

<!-- EDITOR -->
<section id="view-editor" class="view" hidden>
  <header class="topbar">
    <button id="ed-back" class="btn">‹ Libreria</button>
    <input id="ed-title" class="title-input" placeholder="Titolo" autocomplete="off">
    <button id="ed-read" class="btn primary">&#x25B6;&#xFE0E; Leggi</button>
  </header>
  <div class="editor-meta">
    <span id="ed-stats"></span>
    <span class="dur">Durata
      <input id="ed-min" type="number" min="0" max="599" inputmode="numeric"> min
      <input id="ed-sec" type="number" min="0" max="59" inputmode="numeric"> s
    </span>
    <button id="ed-estimate" class="btn small">Usa la stima</button>
    <span id="ed-saved" class="muted"></span>
  </div>
  <textarea id="ed-text" placeholder="Scrivi o incolla qui il testo dello script"></textarea>
</section>

<!-- PROMPTER -->
<section id="view-prompter" class="view" hidden>
  <div id="stage">
    <div id="mirror">
      <div id="viewport">
        <div id="guide" data-style="arrows">
          <div class="g-band"></div>
          <div class="g-line"></div>
          <div class="g-arrow left"></div>
          <div class="g-arrow right"></div>
          <div class="g-handle left" data-drag="guide"></div>
          <div class="g-handle right" data-drag="guide"></div>
        </div>
        <div id="clip"><div id="text"></div></div>
      </div>
      <div id="timer" data-drag="timer"></div>
      <div id="countdown" hidden></div>
    </div>
  </div>

  <div id="opbar">
    <input id="op-progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Avanzamento">
    <div class="op-row">
      <button class="op-btn" data-cmd="close" title="Chiudi (Esc)" aria-label="Chiudi">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="op-btn" data-cmd="restart" title="Ricomincia (R)" aria-label="Ricomincia">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button class="op-btn" id="op-flipH" data-cmd="flipH" title="Ribalta orizzontale (H)" aria-label="Ribalta orizzontale">
        <svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M9 7l-6 5 6 5z"/><path d="M15 7l6 5-6 5z"/></svg></button>
      <button class="op-btn" id="op-flipV" data-cmd="flipV" title="Ribalta verticale (V)" aria-label="Ribalta verticale">
        <svg viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="2 2.5"/><path d="M7 9l5-6 5 6z"/><path d="M7 15l5 6 5-6z"/></svg></button>
      <button class="op-btn" id="op-settings" data-cmd="settings" title="Impostazioni" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      <span class="op-sep"></span>
      <button class="op-btn" data-cmd="slower" title="Più lento (freccia giù)" aria-label="Più lento">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span id="op-speed"></span>
      <button class="op-btn" data-cmd="faster" title="Più veloce (freccia su)" aria-label="Più veloce">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <button class="op-btn op-play" id="op-play" data-cmd="toggle" title="Play / pausa (Spazio)" aria-label="Play">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <span id="op-time"></span>
    </div>
  </div>

  <aside id="panel" data-side="right" hidden>
    <div class="panel-head">
      <h2>Impostazioni</h2>
      <button id="panel-reset" class="btn small">Ripristina</button>
      <button id="panel-close" class="op-btn" aria-label="Chiudi impostazioni">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="panel-body"></div>
  </aside>
</section>

<div id="toast" role="status"></div>
</body>
</html>
